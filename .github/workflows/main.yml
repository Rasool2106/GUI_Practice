name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          target: desktop
          arch: linux_gcc_64
          modules: qtnetwork
          setup-python: true
          cache: false

      - name: Show Qt version
        run: qmake --version

      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
